name: native-libs

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: r28c
  # Поставьте ту же версию Zig, что у вас локально
  ZIG_VERSION: 0.17.0

jobs:
  ffmpeg:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache ffmpeg dependencies
        uses: actions/cache@v4
        with:
          path: build/prefix
          key: ffmpeg-prefix-${{ env.NDK_VERSION }}-${{ hashFiles('ffmpeg/build_ffmpeg.sh') }}

      - name: Build libffmpeg.so
        run: |
          chmod +x ffmpeg/build_ffmpeg.sh
          ./ffmpeg/build_ffmpeg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-arm64
          path: out/libffmpeg.so

  zig:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build Zig libraries
        working-directory: zig
        run: |
          chmod +x build_libs.sh
          ./build_libs.sh "$GITHUB_WORKSPACE/out/arm64-v8a"

      - uses: actions/upload-artifact@v4
        with:
          name: zig-arm64
          path: out/arm64-v8a/*.so

  package:
    needs: [ffmpeg, zig]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Collect jniLibs
        run: |
          mkdir -p jniLibs/arm64-v8a
          cp dl/ffmpeg-arm64/libffmpeg.so jniLibs/arm64-v8a/
          cp dl/zig-arm64/*.so jniLibs/arm64-v8a/
          ls -la jniLibs/arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: jniLibs-arm64-v8a
          path: jniLibs/arm64-v8a/
