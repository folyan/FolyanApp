name: Build & Sign Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Фиксируем Python 3.11 для Chaquopy (чтобы был модуль cgi)
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Ставим Gradle 8.9
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # Собираем Release APK
      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      # Подписываем APK
      - name: Sign APK manually
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Находим папку build-tools
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Используем Build Tools: $BUILD_TOOLS_DIR"
          export PATH="$BUILD_TOOLS_DIR:$PATH"

          # 2. Восстанавливаем keystore файл (вырезаем пробелы/переносы строк и игнорируем мусор)
          printf "%s" "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d --ignore-garbage > release.keystore

          # 3. Находим скомпилированный APK
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Ошибка: APK не найден в app/build/outputs/apk/release"
            exit 1
          fi
          echo "Найден APK: $UNSIGNED_APK"

          ALIGNED_APK="app/build/outputs/apk/release/app-aligned.apk"
          SIGNED_APK="app/build/outputs/apk/release/app-release-signed.apk"

          # 4. Выравниваем через zipalign
          zipalign -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          # 5. Подписываем через apksigner
          apksigner sign \
            --ks release.keystore \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          # 6. Проверяем подпись
          apksigner verify "$SIGNED_APK"
          echo "APK успешно подписан!"

          # Удаляем временные файлы ключа
          rm -f release.keystore "$ALIGNED_APK"

      # Выгружаем подписанный APK в артефакты
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error
