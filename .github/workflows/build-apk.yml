name: Build Full Android App

on:
  push:
    branches: [ "main", "master" ]

env:
  NDK_VERSION: r28c
  ZIG_VERSION: 0.17.0

jobs:
  ffmpeg:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 --retry-delay 3 -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install pkg-config
        run: sudo apt-get update && sudo apt-get install -y pkg-config

      - name: Cache ffmpeg dependencies
        uses: actions/cache@v4
        with:
          path: build/prefix
          key: ffmpeg-prefix-${{ env.NDK_VERSION }}-${{ hashFiles('ffmpeg/build_ffmpeg.sh') }}

      - name: Build libffmpeg.so
        run: |
          chmod +x ffmpeg/build_ffmpeg.sh
          ./ffmpeg/build_ffmpeg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-arm64
          path: out/libffmpeg.so

  zig:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build Zig libraries
        working-directory: zig
        run: |
          chmod +x build_libs.sh
          ./build_libs.sh "$GITHUB_WORKSPACE/out/arm64-v8a"

      - uses: actions/upload-artifact@v4
        with:
          name: zig-arm64
          path: out/arm64-v8a/*.so

  build-apk:
    needs: [ffmpeg, zig]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Place native libraries into jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp dl/ffmpeg-arm64/libffmpeg.so app/src/main/jniLibs/arm64-v8a/
          cp dl/zig-arm64/*.so app/src/main/jniLibs/arm64-v8a/
          echo "Содержимое jniLibs:"
          ls -lh app/src/main/jniLibs/arm64-v8a

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          export PATH="$BUILD_TOOLS_DIR:$PATH"

          printf "%s" "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d --ignore-garbage > release.keystore

          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          ALIGNED_APK="app/build/outputs/apk/release/app-aligned.apk"
          SIGNED_APK="app/build/outputs/apk/release/app-release-signed.apk"

          zipalign -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          apksigner sign \
            --ks release.keystore \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          apksigner verify "$SIGNED_APK"
          rm -f release.keystore "$ALIGNED_APK"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error
